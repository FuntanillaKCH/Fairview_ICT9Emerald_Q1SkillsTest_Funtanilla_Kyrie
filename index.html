<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Skills Test</title>
    <style>
        #foot {
            background: #2A7B9B;
            background: linear-gradient(90deg,rgba(198,198,225, 1) 0%, rgba(246,173,201, 1) 50%, rgba(240,205,225, 1) 100%);
            color: #fff;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
            margin-bottom: 40px;
            border-radius: 10px;
        }
        body {
            font-family: 'Gill Sans', 'Gill Sans MT', sans-serif;
            background-image: url("https://2018media.idtech.com/images/blog/featured/1597707033_should-my-child-join-robotics-club-first-robotics.png");
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            text-align: center;
        }
         section{
               background-color: #fff;
            padding: 20px;
            border-radius: 12px;
            width: 600px;
            margin: auto;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
         }
         img{
           display: block;
            margin: auto;
            height: 110px;
            width: 500px;
            padding: 0px;
            object-fit: cover; 
        }
    </style>
</head>
<body>
    <section>
        <img src="https://images.squarespace-cdn.com/content/v1/664c7ae50eea9c731b37e817/e01fd0f1-eda0-443b-ab56-74f748469f01/Header.png?format=1500w" alt="obmc logo">
        <h2>Join the Robotics Club today!</h2>
        <p>We offer:</p>
        <ul>
        <li>Robot Design and Engineering</li>
        <li> Programming and Coding Robotics</li>
        <li>Robot Testing, Troubleshooting, & Iteration</li>    
        </ul>

        <ul><a href="https://www.playtolabs.com/blog/robotics-for-beginners" target="_blank">What is Robotics?</a>
    </section>
<section>
    <h3>APPLICATION FORM</h3>
    <div class="">
        <div class=""></div>
            <form action="">
                        <label for=""><b>Full Name</b></label>
                        <br>
              <input type="text" id="name" name="name" placeholder="John Doe"> <br>
                      <label for=""><b>Email</b></label>
                      <br>
              <input type="email" id="email" name="email" placeholder="JohnDoe@gmail.com"> <br>
              <br>
            <label for=""><b>Year Level</b></label>
            <br>
                <select name="year" id="year">
                    <option value="7">Grade 7</option>
                    <option value="8">Grade 8</option>
                    <option value="9">Grade 9</option>
                    <option value="10">Grade 10</option>
                    <option value="11">Grade 11</option>
                    <option value="12">Grade 12</option>
                   </select>
                   <br>
                   <br>
                   <label for=""><b>Gender</b></label>
                  <br>
                     <input type="radio" id="female" name="gender">
                  <label for="gender1">Female</label>
                     <input type="radio" id="male" name="gender">
                <label for="gender2">Male</label>
                     <input type="radio" id="other" name="gender">
                <label for="gender3">Other</label>
                <br>
                   <label for=""><b>Skills</b></label>
                   <br>
                <input type="checkbox" id="coding" name="coding">
                <label for="skill1">Coding</label>
                 <input type="checkbox" id="design" name="design">
                <label for="skill2">Design</label>
                 <input type="checkbox" id="electronics" name="electronics">
                <label for="skill1">Electronics</label>
<br>
                <br>
        <textarea id="review" placeholder="I want to join the Robotics Club because..." rows="4" cols="40"></textarea>
        <br>

        <input type="submit" id="submit" value="Submit">
        <br>
            </form>
    </div>
</section>
    <footer>
        <p id="ft"> Robotics Club Form | Created by Kyrie Funtanilla 9-Emerald</p>
    </footer>
     <!--Reference 
        https://www.idtech.com/blog/should-your-child-join-a-robotics-team
    -->
</body>
</html>
